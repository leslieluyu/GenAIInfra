replicaCount: 2
# LOGFLAG: "True"
image:
  repository: opea/chatqna
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.2"

port: 8888
service:
  type: NodePort
  port: 8888
  nodePort: 30888

# resources:
#   limits:
#     cpu: 16
#     memory: 8000Mi
#   requests:
#     cpu: 16
#     memory: 8000Mi
nginx:
  service:
    type: NodePort

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}

tolerations: []

affinity: {}

# This is just to avoid Helm errors when HPA is NOT used
# (use hpa-values.yaml files to actually enable HPA).
autoscaling:
  enabled: false

# Override values in specific subcharts
tgi:
  replicaCount: 7
  accelDevice: "gaudi"
  image:
    repository: ghcr.io/huggingface/tgi-gaudi
    tag: "2.3.1"
    # tag: "2.0.5"
  resources:
    limits:
      habana.ai/gaudi: 1
  # LLM_MODEL_ID: Intel/neural-chat-7b-v3-3
  # MAX_BATCH_SIZE: "1"
  MAX_INPUT_LENGTH: "1280"
  MAX_TOTAL_TOKENS: "2048"
  MAX_BATCH_PREFILL_TOKENS : "4096"
  MAX_BATCH_TOTAL_TOKENS : "65536"
  CUDA_GRAPHS: ""
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  ENABLE_HPU_GRAPH: "true"
  LIMIT_HPU_GRAPH: "true"
  USE_FLASH_ATTENTION: "true"
  FLASH_ATTENTION_RECOMPUTE: "true"

# disable guardrails-usvc by default
# See guardrails-values.yaml for guardrail related options
  enabled: true
vllm:
  replicaCount: 8
  enabled: false
  shmSize: 1Gi
  accelDevice: "gaudi"
  image:
    repository: opea/vllm-gaudi
  resources:
    limits:
      habana.ai/gaudi: 1
  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 180
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 1
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 1

  PT_HPU_ENABLE_LAZY_COLLECTIVES: "true"
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  LLM_MODEL_ID: Intel/neural-chat-7b-v3-3
  extraCmdArgs: [
    "--tensor-parallel-size", "1",
    "--block-size", "128",
    "--max-num-seqs", "1",
    "--max-seq_len-to-capture", "2048"
  ]



guardrails-usvc:
  enabled: false

# If you would like to switch to traditional UI image
# Uncomment the following lines
chatqna-ui:
  image:
    repository: "opea/chatqna-ui"
    tag: "${IMGVER}"
  containerPort: "5173"
tei:
  image:
    repository: ghcr.io/huggingface/text-embeddings-inference
    tag: cpu-1.5    
  # resources:
  #   limits:
  #     cpu: 76
  #     memory: 20000Mi
  #   requests:
  #     cpu: 76
  #     memory: 20000Mi
  # image:
  #   repository: opea/tei-gaudi
  #   tag: "${IMGVER}"
  # resources:
  #   limits:
  #     habana.ai/gaudi: 1
  securityContext:
    readOnlyRootFilesystem: false
  evenly_distributed: True
data-prep:
  image:
    repository: opea/dataprep
    tag: "${IMGVER}"
  # port: 6010
  # evenly_distributed: True
  # livenessProbe:
  #   httpGet:
  #     path: v1/health_check
  #     port: data-prep
  #   initialDelaySeconds: 5
  #   periodSeconds: 5
  #   failureThreshold: 2400
  # LOGFLAG: "True"

retriever-usvc:
  replicaCount: 2
  image:
    repository: opea/retriever
    tag: "${IMGVER}"
  port: 7000
  evenly_distributed: True
  # LOGFLAG: "True"
  readinessProbe: ""
  # resources:
  #   requests:
  #     cpu: 8
  #     memory: 8000Mi
embedding-usvc:
  image:
    repository: opea/embedding-tei
    tag: "${IMGVER}"
  evenly_distributed: True
  # LOGFLAG: "True"
llm-uservice:
  image:
    repository: opea/llm-tgi
    tag: "${IMGVER}"
    #tag: "1.0_fix"
  # LLM_MODEL_ID: Intel/neural-chat-7b-v3-3
  evenly_distributed: True
  # LOGFLAG: "True"

teirerank:
  accelDevice: "gaudi"
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  MAX_WARMUP_SEQUENCE_LENGTH: "512"
  image:
    repository: ghcr.io/huggingface/tei-gaudi
    tag: 1.5.0
  resources:
    limits:
      habana.ai/gaudi: 1
  securityContext:
    readOnlyRootFilesystem: false
  livenessProbe:
    timeoutSeconds: 1
  readinessProbe:
    timeoutSeconds: 1
  enabled: true
  
global:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  HUGGINGFACEHUB_API_TOKEN: "insert-your-huggingface-token-here"
  # set modelUseHostPath or modelUsePVC to use model cache.
  modelUseHostPath: ${MODELDIR}
  # modelUseHostPath: /mnt/opea-models
  # modelUsePVC: model-volume

  # Install Prometheus serviceMonitors for service components
  monitoring: false

  # Prometheus Helm install release name needed for serviceMonitors
  prometheusRelease: prometheus-stack
