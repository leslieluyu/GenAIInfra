replicaCount: 1
# LOGFLAG: "True"
image:
  repository: opea/chatqna-without-rerank
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

port: 8888
service:
  type: NodePort
  port: 8888
  nodePort: 30888

nginx:
  service:
    type: NodePort
  tag: "${IMGVER}"
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}

tolerations: []

affinity: {}

# This is just to avoid Helm errors when HPA is NOT used
# (use hpa-values.yaml files to actually enable HPA).
autoscaling:
  enabled: false

# Override values in specific subcharts
tgi:
  replicaCount: 8
  accelDevice: "gaudi"
  image:
    repository: ghcr.io/huggingface/tgi-gaudi
    tag: "2.0.5"
  resources:
    limits:
      habana.ai/gaudi: 1
  LLM_MODEL_ID: Intel/neural-chat-7b-v3-3
  MAX_BATCH_SIZE: "1"
  MAX_INPUT_LENGTH: "2500"
  MAX_TOTAL_TOKENS: "4096"
# disable guardrails-usvc by default
# See guardrails-values.yaml for guardrail related options
  enabled: false
vllm:
  replicaCount: 8
  enabled: true
  shmSize: 1Gi
  accelDevice: "gaudi"
  image:
    repository: opea/vllm-gaudi
    tag: "${IMGVER}"
  resources:
    limits:
      habana.ai/gaudi: 1
  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 360
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 1
  # livenessProbe:
  #   initialDelaySeconds: 5
  #   periodSeconds: 5
  #   timeoutSeconds: 1

  PT_HPU_ENABLE_LAZY_COLLECTIVES: "true"
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  # LLM_MODEL_ID: Intel/neural-chat-7b-v3-3
  extraCmdArgs: [
    "--tensor-parallel-size", "1",
    "--block-size", "128",
    "--max-num-seqs", "1",
    "--max-seq_len-to-capture", "2048"
  ]



guardrails-usvc:
  enabled: false

# If you would like to switch to traditional UI image
# Uncomment the following lines
chatqna-ui:
  image:
    repository: "opea/chatqna-ui"
    tag: "${IMGVER}"
  containerPort: "5173"
tei:
  image:
    repository: ghcr.io/huggingface/text-embeddings-inference
    tag: cpu-1.5    
  resources:
    limits:
      habana.ai/gaudi: 0
  # image:
  #   repository: opea/tei-gaudi
  #   tag: "${IMGVER}"
  # resources:
  #   limits:
  #     habana.ai/gaudi: 1
  securityContext:
    readOnlyRootFilesystem: false
  evenly_distributed: True
tei-gaudi:
  replicaCount: 1
  enabled: true
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  MAX_WARMUP_SEQUENCE_LENGTH: "512"
  image:
    repository: ghcr.io/huggingface/tei-gaudi
    tag: 1.5.0

  securityContext:
    readOnlyRootFilesystem: false

  resources:
    limits:
      habana.ai/gaudi: 1

  readinessProbe:
    timeoutSeconds: 1
data-prep:
  image:
    repository: opea/dataprep
    tag: "${IMGVER}"
  TEI_EMBEDDING_ENDPOINT: "http://chatqna-tei-gaudi"
  # port: 6010
  # evenly_distributed: True
  # livenessProbe:
  #   httpGet:
  #     path: v1/health_check
  #     port: data-prep
  #   initialDelaySeconds: 5
  #   periodSeconds: 5
  #   failureThreshold: 2400
  # LOGFLAG: "True"

retriever-usvc:
  image:
    repository: opea/retriever
    tag: "v1.3_OPT2"
  port: 7000
  evenly_distributed: True
  # LOGFLAG: "True"
  readinessProbe: ""
  # REDIS_SCHEMA: "redis_schema_hnsw.yml"
embedding-usvc:
  image:
    repository: opea/embedding-tei
    tag: "${IMGVER}"
  evenly_distributed: True
  # LOGFLAG: "True"
llm-uservice:
  image:
    repository: opea/llm-tgi
    tag: "${IMGVER}"
    #tag: "1.0_fix"
  LLM_MODEL_ID: Intel/neural-chat-7b-v3-3
  evenly_distributed: True
  # LOGFLAG: "True"

teirerank:
  enabled: false
  
global:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  HUGGINGFACEHUB_API_TOKEN: "insert-your-huggingface-token-here"
  # set modelUseHostPath or modelUsePVC to use model cache.
  modelUseHostPath: ${MODELDIR}
  # modelUseHostPath: /mnt/opea-models
  # modelUsePVC: model-volume

  # Install Prometheus serviceMonitors for service components
  monitoring: false

  # Prometheus Helm install release name needed for serviceMonitors
  prometheusRelease: prometheus-stack